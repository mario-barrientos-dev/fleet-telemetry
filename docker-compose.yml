services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    ports:
      - "55432:5432"  # host:container — uncommon host port to avoid clashes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://fleet:fleet@db:5432/fleet
      APP_LOG_LEVEL: INFO
      APP_ENVIRONMENT: dev
      APP_CORS_ORIGINS: http://localhost:5173,http://localhost:18080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "18080:80"  # host:container — 18080 to avoid clashes
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
