[project]
name = "fleet-telemetry-api"
version = "0.1.0"
description = "Fleet telemetry monitoring service — Qualitara take-home."
requires-python = ">=3.12"
# Runtime + dev dependencies are managed via conda (see environment.yml).
# pyproject.toml keeps tool configuration only.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions", "tests/.*"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "uuid_utils.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring a real database",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic",
]
